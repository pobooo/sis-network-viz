<body>
  <header>
    <div class="inner">
      <div class="titles">
        <p class="kicker">Interactive demo</p>
        <h1 data-i18n="title">网络上的 SIS 传播</h1>
        <p class="sub" data-i18n="subtitle">有效感染率 τ 越过阈值后，感染才能在网络上长期存在；阈值由网络结构决定</p>
      </div>
      <div class="meta">
        <span>by <a href="https://qiangliu.net">Qiang Liu</a></span>
        <div class="lang-switch">
          <button data-lang="zh">中</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
      <p class="intro" data-i18n-html="intro"></p>
      <p class="related" data-i18n-html="related"></p>
    </div>
  </header>

  <main>
    <aside class="panel">
      <h3 data-i18n="panel.network">网络</h3>
      <label data-i18n="panel.type">网络类型</label>
      <select id="net-type">
        <option value="er" data-i18n="net.er">随机图 (Erdős–Rényi)</option>
        <option value="ba" data-i18n="net.ba">无标度网络 (Barabási–Albert)</option>
        <option value="ws" data-i18n="net.ws">小世界网络 (Watts–Strogatz)</option>
      </select>
      <label><span data-i18n="panel.n">节点数 N</span>: <b id="n-val">300</b></label>
      <input type="range" id="n" min="50" max="2000" step="50" value="300" />
      <label><span data-i18n="panel.k">平均度 ⟨k⟩</span>: <b id="k-val">6</b></label>
      <input type="range" id="k" min="2" max="12" step="2" value="6" />

      <h3 style="margin-top:22px" data-i18n="panel.process">传播过程</h3>
      <label><span data-i18n="panel.tau">有效感染率 τ = β/δ</span>: <b id="tau-val">0.30</b></label>
      <input type="range" id="tau" min="0" max="1" step="0.005" value="0.3" />
      <label><span data-i18n="panel.alpha">感染时间 Weibull 形状 α</span>: <b id="alpha-val">1.00</b> <span id="alpha-note" style="color:var(--muted)"></span></label>
      <input type="range" id="alpha" min="-1.2" max="2.3" step="0.02" value="0" />
      <label><span data-i18n="panel.init">初始感染比例</span>: <b id="init-val">10%</b></label>
      <input type="range" id="init" min="1" max="100" step="1" value="10" />
      <label><span data-i18n="panel.speed">播放速度</span>: <b id="speed-val">2×</b></label>
      <input type="range" id="speed" min="0.5" max="10" step="0.5" value="2" />

      <div class="btn-group">
        <button class="primary" id="btn-run" data-i18n="btn.start">开始</button>
        <button class="secondary" id="btn-reset" data-i18n="btn.reset">重新感染</button>
        <button class="secondary" id="btn-regen" data-i18n="btn.regen">新网络</button>
        <button class="sweep" id="btn-sweep" data-i18n="btn.sweep">扫描 τ，画稳态曲线</button>
      </div>
      <div class="status" id="status"></div>

      <h3 style="margin-top:22px" data-i18n="panel.stats">网络与阈值</h3>
      <div class="kv"><span data-i18n="stat.edges">边数</span><b id="s-edges">–</b></div>
      <div class="kv"><span>λ<sub>1</sub></span><b id="s-lambda">–</b></div>
      <div class="kv"><span data-i18n-html="stat.nimfa"></span><b id="s-tauc">–</b></div>
      <div class="kv"><span data-i18n-html="stat.hmf"></span><b id="s-hmf">–</b></div>
      <div class="kv"><span data-i18n="stat.taucMax">最大平均场阈值 1/ln(1+λ₁)</span><b id="s-taucmax">–</b></div>
      <div class="kv"><span>τ / τ<sub>c</sub><sup>(1)</sup></span><b id="s-ratio">–</b></div>
      <div class="kv"><span data-i18n="stat.t">时间 t</span><b id="s-t">–</b></div>
      <div class="kv"><span data-i18n="stat.prev">感染比例</span><b id="s-prev">–</b></div>
    </aside>

    <section class="content">
      <div class="card net-wrap">
        <h4><span style="margin-left:0" data-i18n="net.hint">点击节点可切换感染状态</span></h4>
        <canvas id="net"></canvas>
        <div class="legend">
          <span><span class="dot" style="background:var(--infected)"></span><span data-i18n="legend.i">感染 (I)</span></span>
          <span><span class="dot" style="background:var(--susceptible);border:1px solid #bdb5a6"></span><span data-i18n="legend.s">易感 (S)</span></span>
        </div>
      </div>

      <div class="chart-row">
        <div class="card chart">
          <h4 data-i18n="chart.time">感染比例随时间变化</h4>
          <canvas id="c-time"></canvas>
          <div class="legend">
            <span><span class="line" style="border-color:var(--sim)"></span><span data-i18n="legend.sim">模拟</span></span>
            <span class="markov-only"><span class="dash" style="border-color:var(--nimfa)"></span><span data-i18n="legend.nimfaLevel">NIMFA 稳态</span></span>
          </div>
        </div>
        <div class="card chart">
          <h4 data-i18n="chart.sweep">稳态感染比例与 τ</h4>
          <canvas id="c-sweep"></canvas>
          <div class="legend">
            <span><span class="dot" style="background:var(--sim)"></span><span data-i18n="legend.simMean">模拟（亚稳态平均）</span></span>
            <span class="markov-only"><span class="line" style="border-color:var(--nimfa)"></span>NIMFA</span>
            <span><span class="dash" style="border-color:var(--nimfa)"></span><span data-i18n-html="legend.nimfaTh"></span></span>
            <span><span class="dash" style="border-color:var(--hmf)"></span><span data-i18n-html="legend.hmfTh"></span></span>
            <span><span class="dash" style="border-color:var(--max)"></span>1/ln(1+λ<sub>1</sub>)</span>
          </div>
        </div>
      </div>

      <div class="formulas">
        <h3 data-i18n="fx.title">模型与公式</h3>
        <div class="block">
          <div class="col" data-i18n-html="fx.sis"></div>
          <div class="col" data-i18n-html="fx.nimfa"></div>
        </div>
        <div class="block" style="margin-top:14px">
          <div class="col" data-i18n-html="fx.threshold"></div>
          <div class="col" data-i18n-html="fx.hmf"></div>
        </div>
        <div class="block" style="margin-top:14px">
          <div class="col" data-i18n-html="fx.weibull"></div>
          <div class="col" data-i18n-html="fx.bounds"></div>
        </div>
        <div class="muted" style="margin-top:12px" data-i18n-html="fx.impl"></div>
        <div class="muted note-box" data-i18n-html="fx.warning"></div>
        <div class="refs" data-i18n-html="fx.refs"></div>
      </div>
    </section>
  </main>

const $ = id => document.getElementById(id);
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const CANVAS_FONT = '"Avenir Next", -apple-system, "PingFang SC", sans-serif';

function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => (Math.random() * 2 ** 31) | 0;

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

// ---------------------------------------------------------------------------
// Network generation
// ---------------------------------------------------------------------------
function buildGraph(N, edgeSet) {
  const adj = Array.from({ length: N }, () => []);
  const edges = [];
  for (const key of edgeSet) {
    const i = Math.floor(key / N), j = key % N;
    adj[i].push(j); adj[j].push(i); edges.push([i, j]);
  }
  return { N, adj, edges };
}
const edgeKey = (i, j, N) => (i < j ? i * N + j : j * N + i);

function genER(N, k, rand) {
  const p = k / (N - 1), set = new Set();
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (rand() < p) set.add(i * N + j);
  return buildGraph(N, set);
}

function genBA(N, k, rand) {
  const m = Math.max(1, Math.round(k / 2)), set = new Set(), pool = [];
  for (let i = 0; i <= m; i++) for (let j = i + 1; j <= m; j++) { set.add(edgeKey(i, j, N)); pool.push(i, j); }
  for (let v = m + 1; v < N; v++) {
    const targets = new Set();
    while (targets.size < m) targets.add(pool[Math.floor(rand() * pool.length)]);
    for (const u of targets) { set.add(edgeKey(u, v, N)); pool.push(u, v); }
  }
  return buildGraph(N, set);
}

function genWS(N, k, rand, rewire = 0.1) {
  const half = Math.max(1, Math.round(k / 2)), set = new Set();
  for (let i = 0; i < N; i++) for (let d = 1; d <= half; d++) set.add(edgeKey(i, (i + d) % N, N));
  for (const key of Array.from(set)) {
    if (rand() >= rewire) continue;
    const i = Math.floor(key / N);
    for (let tries = 0; tries < 20; tries++) {
      const j = Math.floor(rand() * N);
      const nk = edgeKey(i, j, N);
      if (j !== i && !set.has(nk)) { set.delete(key); set.add(nk); break; }
    }
  }
  return buildGraph(N, set);
}

// Fruchterman–Reingold layout in the unit square.
function layoutGraph(g, rand) {
  const { N, edges } = g;
  const x = new Float64Array(N), y = new Float64Array(N);
  for (let i = 0; i < N; i++) { x[i] = rand(); y[i] = rand(); }
  const kf = Math.sqrt(1 / N);
  const dx = new Float64Array(N), dy = new Float64Array(N);
  const exact = N <= 400, iters = exact ? 250 : 180;
  const repel = (i, j) => {
    const ex = x[i] - x[j], ey = y[i] - y[j];
    const d2 = ex * ex + ey * ey + 1e-9, f = (kf * kf) / d2;
    dx[i] += ex * f; dy[i] += ey * f; dx[j] -= ex * f; dy[j] -= ey * f;
  };
  // Large graphs: grid variant of Fruchterman–Reingold, repulsion only within 2k.
  const cs = 2 * kf, next = new Int32Array(N);
  let temp = 0.1;
  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);
    if (exact) {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) repel(i, j);
    } else {
      let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
      for (let i = 0; i < N; i++) { mx = Math.min(mx, x[i]); my = Math.min(my, y[i]); Mx = Math.max(Mx, x[i]); My = Math.max(My, y[i]); }
      const W = Math.floor((Mx - mx) / cs) + 1, H = Math.floor((My - my) / cs) + 1;
      const head = new Int32Array(W * H).fill(-1), cell = new Int32Array(N);
      for (let i = 0; i < N; i++) {
        const c = Math.floor((y[i] - my) / cs) * W + Math.floor((x[i] - mx) / cs);
        cell[i] = c; next[i] = head[c]; head[c] = i;
      }
      const cs2 = cs * cs;
      for (let i = 0; i < N; i++) {
        const cx = cell[i] % W, cy = (cell[i] - cx) / W;
        for (let oy = -1; oy <= 1; oy++) {
          const yy = cy + oy; if (yy < 0 || yy >= H) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const xx = cx + ox; if (xx < 0 || xx >= W) continue;
            for (let j = head[yy * W + xx]; j !== -1; j = next[j]) {
              if (j <= i) continue;
              const ex = x[i] - x[j], ey = y[i] - y[j];
              if (ex * ex + ey * ey < cs2) repel(i, j);
            }
          }
        }
      }
    }
    for (const [i, j] of edges) {
      const ex = x[i] - x[j], ey = y[i] - y[j];
      const d = Math.sqrt(ex * ex + ey * ey) + 1e-9, f = d / kf;
      dx[i] -= ex * f; dy[i] -= ey * f; dx[j] += ex * f; dy[j] += ey * f;
    }
    for (let i = 0; i < N; i++) {
      dx[i] += (0.5 - x[i]) * 0.05 * N * kf; dy[i] += (0.5 - y[i]) * 0.05 * N * kf;
      const d = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) + 1e-9, s = Math.min(d, temp) / d;
      x[i] += dx[i] * s; y[i] += dy[i] * s;
    }
    temp = Math.max(0.002, temp * 0.97);
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < N; i++) { x0 = Math.min(x0, x[i]); x1 = Math.max(x1, x[i]); y0 = Math.min(y0, y[i]); y1 = Math.max(y1, y[i]); }
  for (let i = 0; i < N; i++) { x[i] = (x[i] - x0) / (x1 - x0 || 1); y[i] = (y[i] - y0) / (y1 - y0 || 1); }
  return { x, y };
}

// ---------------------------------------------------------------------------
// Spectral quantities and NIMFA
// ---------------------------------------------------------------------------
function largestEigenvalue(g) {
  const { N, adj } = g;
  let v = new Float64Array(N).fill(1 / Math.sqrt(N)), lambda = 0;
  for (let it = 0; it < 1000; it++) {
    // Power iteration on A + I avoids oscillation on bipartite graphs.
    const w = new Float64Array(N);
    for (let i = 0; i < N; i++) { let s = v[i]; for (const j of adj[i]) s += v[j]; w[i] = s; }
    let dot = 0, norm = 0;
    for (let i = 0; i < N; i++) { dot += v[i] * w[i]; norm += w[i] * w[i]; }
    norm = Math.sqrt(norm);
    const next = dot - 1;
    for (let i = 0; i < N; i++) v[i] = w[i] / norm;
    if (Math.abs(next - lambda) < 1e-10) { lambda = next; break; }
    lambda = next;
  }
  return lambda;
}

function nimfaSteady(g, tau, warm = null, maxIter = 3000) {
  const { N, adj } = g;
  if (tau <= 0) return 0;
  const v = warm || new Float64Array(N).fill(1);
  for (let it = 0; it < maxIter; it++) {
    let change = 0;
    for (let i = 0; i < N; i++) {
      let s = 0;
      for (const j of adj[i]) s += v[j];
      const nv = (tau * s) / (1 + tau * s);
      change = Math.max(change, Math.abs(nv - v[i]));
      v[i] = nv;
    }
    if (change < 1e-9) break;
  }
  let sum = 0;
  for (let i = 0; i < N; i++) sum += v[i];
  return sum / N;
}

// ---------------------------------------------------------------------------
// Weibull infection times: mean-field threshold for renewal infections
// ---------------------------------------------------------------------------
function gammaFn(z) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gammaFn(1 - z));
  z -= 1;
  let x = c[0];
  for (let i = 1; i < 9; i++) x += c[i] / (z + i);
  const t = z + 7.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
// Weibull scale so that the mean infection time is 1/τ.
const weibullScale = (tau, alpha) => 1 / (tau * gammaFn(1 + 1 / alpha));
function seedInfected(S, N, rand, frac) {
  const order = Array.from({ length: N }, (_, i) => i);
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const n0 = Math.max(1, Math.round(frac * N));
  for (let i = 0; i < n0; i++) S.infect(order[i]);
}

// ---------------------------------------------------------------------------
// Non-Markovian SIS: event-driven simulation with a priority queue.
// Each infected node runs a renewal process of infection attempts on every link,
// with Weibull inter-attempt times; curing stays exponential with rate δ = 1.
// ---------------------------------------------------------------------------
function makeWeibullSIS(g, rand, alpha, tau0) {
  const { N, adj } = g;
  const infected = new Uint8Array(N), epoch = new Int32Array(N);
  const S = { infected, nI: 0, t: 0, tau: tau0 };
  let cap = 1024, size = 0;
  let ht = new Float64Array(cap), hv = new Int32Array(cap), hu = new Int32Array(cap), he = new Int32Array(cap);
  const grow = () => {
    cap *= 2;
    const t2 = new Float64Array(cap), v2 = new Int32Array(cap), u2 = new Int32Array(cap), e2 = new Int32Array(cap);
    t2.set(ht); v2.set(hv); u2.set(hu); e2.set(he);
    ht = t2; hv = v2; hu = u2; he = e2;
  };
  const push = (t, v, u, e) => {
    if (size === cap) grow();
    let i = size++;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (ht[p] <= t) break;
      ht[i] = ht[p]; hv[i] = hv[p]; hu[i] = hu[p]; he[i] = he[p];
      i = p;
    }
    ht[i] = t; hv[i] = v; hu[i] = u; he[i] = e;
  };
  const top = { t: 0, v: 0, u: 0, e: 0 };
  const pop = () => {
    top.t = ht[0]; top.v = hv[0]; top.u = hu[0]; top.e = he[0];
    size--;
    if (size === 0) return;
    const lt = ht[size], lv = hv[size], lu = hu[size], le = he[size];
    let i = 0;
    while (true) {
      let c = 2 * i + 1;
      if (c >= size) break;
      if (c + 1 < size && ht[c + 1] < ht[c]) c++;
      if (ht[c] >= lt) break;
      ht[i] = ht[c]; hv[i] = hv[c]; hu[i] = hu[c]; he[i] = he[c];
      i = c;
    }
    ht[i] = lt; hv[i] = lv; hu[i] = lu; he[i] = le;
  };
  const attemptDelay = () => weibullScale(S.tau, alpha) * Math.pow(-Math.log(1 - rand()), 1 / alpha);

  S.infect = v => {
    if (infected[v]) return;
    infected[v] = 1; S.nI++;
    const e = ++epoch[v];
    push(S.t - Math.log(1 - rand()), v, -1, e);
    if (S.tau > 0) for (const u of adj[v]) push(S.t + attemptDelay(), v, u, e);
  };
  // Bumping the epoch invalidates all pending events of v.
  S.recover = v => {
    if (!infected[v]) return;
    infected[v] = 0; S.nI--; epoch[v]++;
  };
  S.step = tau => {
    S.tau = tau;
    while (size > 0) {
      pop();
      const { t, v, u, e } = top;
      if (e !== epoch[v] || !infected[v]) continue;
      const dt = t - S.t;
      S.t = t;
      if (u < 0) {
        S.recover(v);
      } else {
        if (!infected[u]) S.infect(u);
        if (S.tau > 0) push(t + attemptDelay(), v, u, e);
      }
      return dt;
    }
    return Infinity;
  };
  S.seed = frac => seedInfected(S, N, rand, frac);
  return S;
}

// ---------------------------------------------------------------------------
// Exact continuous-time Markovian SIS simulation (Gillespie)
// ---------------------------------------------------------------------------
function makeSIS(g, rand) {
  const { N, adj } = g;
  const infected = new Uint8Array(N), infNbrs = new Int32Array(N);
  const list = new Int32Array(N), pos = new Int32Array(N).fill(-1);
  const S = { infected, nI: 0, siEdges: 0, t: 0 };

  // Fenwick tree over susceptible nodes, weighted by their number of infected neighbors,
  // so the node to infect is drawn in O(log N).
  const tree = new Int32Array(N + 1);
  let top = 1; while (top * 2 <= N) top *= 2;
  const fenAdd = (i, d) => { for (i++; i <= N; i += i & -i) tree[i] += d; };
  const fenFind = r => {
    let idx = 0;
    for (let b = top; b > 0; b >>= 1) {
      const nx = idx + b;
      if (nx <= N && tree[nx] <= r) { idx = nx; r -= tree[nx]; }
    }
    return idx;
  };

  S.infect = v => {
    if (infected[v]) return;
    infected[v] = 1; pos[v] = S.nI; list[S.nI++] = v;
    S.siEdges -= infNbrs[v];
    if (infNbrs[v]) fenAdd(v, -infNbrs[v]);
    for (const u of adj[v]) { infNbrs[u]++; if (!infected[u]) { S.siEdges++; fenAdd(u, 1); } }
  };
  S.recover = v => {
    if (!infected[v]) return;
    infected[v] = 0;
    const p = pos[v], last = list[--S.nI];
    list[p] = last; pos[last] = p; pos[v] = -1;
    S.siEdges += infNbrs[v];
    if (infNbrs[v]) fenAdd(v, infNbrs[v]);
    for (const u of adj[v]) { infNbrs[u]--; if (!infected[u]) { S.siEdges--; fenAdd(u, -1); } }
  };
  // Advance by one event. Returns the time step, or Infinity if absorbed.
  S.step = tau => {
    const rRec = S.nI, rInf = tau * S.siEdges, total = rRec + rInf;
    if (total <= 0) return Infinity;
    const dt = -Math.log(1 - rand()) / total;
    S.t += dt;
    if (rand() * total < rRec) {
      S.recover(list[Math.floor(rand() * S.nI)]);
    } else {
      S.infect(fenFind(Math.floor(rand() * S.siEdges)));
    }
    return dt;
  };
  S.seed = frac => seedInfected(S, N, rand, frac);
  return S;
}

// ---------------------------------------------------------------------------
// App state
// ---------------------------------------------------------------------------
let graph = null, layout = null, stats = null, sim = null;
let history = [];
let sweep = { points: [], nimfa: [], range: null, running: false, token: 0 };

function currentTau() { return +$('tau').value; }
// The α slider is on a log scale; its middle position is exactly α = 1.
function currentAlpha() {
  const s = +$('alpha').value;
  return Math.abs(s) < 1e-9 ? 1 : Math.exp(s);
}
const isMarkov = () => currentAlpha() === 1;

function createSim(g, rand, tau) {
  return isMarkov() ? makeSIS(g, rand) : makeWeibullSIS(g, rand, currentAlpha(), tau);
}

function sweepRange() {
  return Math.min(1, Math.max(3 * stats.tauc, 1.15 * stats.taucMax, 0.05));
}

function updateAlpha() {
  const a = currentAlpha();
  document.body.classList.toggle('weibull', !isMarkov());
  $('alpha-val').textContent = a.toFixed(2);
  $('alpha-note').textContent = tr(a === 1 ? 'alpha.exp' : a < 1 ? 'alpha.bursty' : 'alpha.regular');
}

function regenerate() {
  stopSweep();
  const rand = makeRng(newSeed());
  const N = +$('n').value, k = +$('k').value, type = $('net-type').value;
  graph = type === 'ba' ? genBA(N, k, rand) : type === 'ws' ? genWS(N, k, rand) : genER(N, k, rand);
  layout = layoutGraph(graph, rand);
  const deg = graph.adj.map(a => a.length);
  const k1 = deg.reduce((a, b) => a + b, 0) / N, k2 = deg.reduce((a, b) => a + b * b, 0) / N;
  const lambda1 = largestEigenvalue(graph);
  stats = { deg, meanDeg: k1, hmf: k2 > 0 ? k1 / k2 : Infinity, lambda1, tauc: 1 / lambda1, taucMax: 1 / Math.log(1 + lambda1) };
  $('s-taucmax').textContent = stats.taucMax.toFixed(3);
  sweep.points = []; sweep.nimfa = []; sweep.range = null;
  $('s-edges').textContent = graph.edges.length;
  $('s-lambda').textContent = lambda1.toFixed(3);
  $('s-tauc').textContent = stats.tauc.toFixed(3);
  $('s-hmf').textContent = Number.isFinite(stats.hmf) ? stats.hmf.toFixed(3) : '–';
  updateAlpha();
  reinfect();
}

function reinfect() {
  const wasRunning = sim && sim.running;
  sim = createSim(graph, makeRng(newSeed()), currentTau());
  sim.seed(+$('init').value / 100);
  sim.running = wasRunning;
  history = [[0, sim.nI / graph.N]];
  updateNimfaLevel();
  setStatus('');
  updateReadout();
  redrawAll();
}

function updateNimfaLevel() {
  if (!stats.nimfaV) stats.nimfaV = new Float64Array(graph.N).fill(1);
  // Warm start from the previous τ; restart from all-infected if it has collapsed to 0.
  if (stats.nimfaV.every(v => v < 1e-12)) stats.nimfaV.fill(1);
  stats.nimfaLevel = nimfaSteady(graph, currentTau(), stats.nimfaV, 800);
  $('s-ratio').textContent = (currentTau() / stats.tauc).toFixed(2);
}

function setStatus(msg) { $('status').textContent = msg; }
function updateReadout() {
  $('s-t').textContent = sim.t.toFixed(2);
  $('s-prev').textContent = (100 * sim.nI / graph.N).toFixed(1) + '%';
}
function setRunning(on) {
  sim.running = on;
  $('btn-run').textContent = tr(on ? 'btn.pause' : 'btn.start');
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function nodeRadius(i) {
  const base = Math.max(1.6, Math.min(7, 55 / Math.sqrt(graph.N)));
  return base * (0.7 + 0.3 * Math.sqrt(stats.deg[i] / Math.max(stats.meanDeg, 1)));
}
function netTransform(w, h) {
  const pad = 14, s = Math.min(w, h) - 2 * pad;
  const ox = (w - s) / 2, oy = (h - s) / 2;
  return { X: x => ox + x * s, Y: y => oy + y * s };
}

function drawNetwork() {
  const { ctx, w, h } = setupCanvas($('net'));
  ctx.clearRect(0, 0, w, h);
  if (!graph) return;
  const { X, Y } = netTransform(w, h);
  ctx.strokeStyle = cssVar('--edge'); ctx.lineWidth = 1;
  ctx.beginPath();
  for (const [i, j] of graph.edges) { ctx.moveTo(X(layout.x[i]), Y(layout.y[i])); ctx.lineTo(X(layout.x[j]), Y(layout.y[j])); }
  ctx.stroke();
  const cI = cssVar('--infected'), cS = cssVar('--susceptible');
  for (let i = 0; i < graph.N; i++) {
    ctx.beginPath();
    ctx.arc(X(layout.x[i]), Y(layout.y[i]), nodeRadius(i), 0, 2 * Math.PI);
    ctx.fillStyle = sim.infected[i] ? cI : cS; ctx.fill();
    ctx.strokeStyle = sim.infected[i] ? cI : '#bdb5a6'; ctx.lineWidth = 1; ctx.stroke();
  }
}

function axes(ctx, w, h, pad, ymax, xLabels, yLabel) {
  ctx.strokeStyle = cssVar('--grid'); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 4; i++) { const y = pad.t + i * (h - pad.t - pad.b) / 4; ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); }
  ctx.stroke();
  ctx.fillStyle = cssVar('--muted'); ctx.font = '12px ' + CANVAS_FONT;
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + i * (h - pad.t - pad.b) / 4;
    ctx.fillText((ymax * (1 - i / 4)).toFixed(2), pad.l - 6, y + 4);
  }
  ctx.textAlign = 'left'; ctx.fillText(xLabels[0], pad.l, h - 8);
  ctx.textAlign = 'center'; if (xLabels[2]) ctx.fillText(xLabels[2], (pad.l + w - pad.r) / 2, h - 8);
  ctx.textAlign = 'right'; ctx.fillText(xLabels[1], w - pad.r, h - 8);
  ctx.textAlign = 'left';
}

function dashedH(ctx, x0, x1, y, color) {
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();
}
function dashedV(ctx, x, y0, y1, color) {
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); ctx.restore();
}

function drawTimeChart() {
  const { ctx, w, h } = setupCanvas($('c-time'));
  ctx.clearRect(0, 0, w, h);
  if (!graph) return;
  const pad = { l: 42, r: 12, t: 10, b: 26 };
  const tmax = Math.max(10, sim.t * 1.05), ymax = 1;
  axes(ctx, w, h, pad, ymax, ['0', tmax.toFixed(0), tr('axis.t')]);
  const X = t => pad.l + (t / tmax) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / ymax) * (h - pad.t - pad.b);
  if (isMarkov()) dashedH(ctx, pad.l, w - pad.r, Y(stats.nimfaLevel), cssVar('--nimfa'));
  ctx.strokeStyle = cssVar('--sim'); ctx.lineWidth = 2;
  ctx.beginPath();
  history.forEach(([t, v], i) => { if (i === 0) ctx.moveTo(X(t), Y(v)); else ctx.lineTo(X(t), Y(v)); });
  ctx.stroke();
}

function drawSweepChart() {
  const { ctx, w, h } = setupCanvas($('c-sweep'));
  ctx.clearRect(0, 0, w, h);
  if (!graph) return;
  const pad = { l: 42, r: 12, t: 10, b: 26 };
  const tmax = sweep.range || sweepRange(), ymax = 1;
  axes(ctx, w, h, pad, ymax, ['0', tmax.toFixed(2), 'τ']);
  const X = t => pad.l + (t / tmax) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / ymax) * (h - pad.t - pad.b);
  if (stats.hmf < tmax) dashedV(ctx, X(stats.hmf), pad.t, h - pad.b, cssVar('--hmf'));
  if (stats.tauc < tmax) dashedV(ctx, X(stats.tauc), pad.t, h - pad.b, cssVar('--nimfa'));
  if (stats.taucMax < tmax) dashedV(ctx, X(stats.taucMax), pad.t, h - pad.b, cssVar('--max'));
  const tau = currentTau();
  if (tau <= tmax) {
    ctx.save(); ctx.strokeStyle = cssVar('--line'); ctx.lineWidth = 6; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(X(tau), pad.t); ctx.lineTo(X(tau), h - pad.b); ctx.stroke(); ctx.restore();
  }
  if (sweep.nimfa.length && isMarkov()) {
    ctx.strokeStyle = cssVar('--nimfa'); ctx.lineWidth = 2;
    ctx.beginPath();
    sweep.nimfa.forEach(([t, v], i) => { if (i === 0) ctx.moveTo(X(t), Y(v)); else ctx.lineTo(X(t), Y(v)); });
    ctx.stroke();
  }
  ctx.fillStyle = cssVar('--sim');
  for (const [t, v] of sweep.points) { ctx.beginPath(); ctx.arc(X(t), Y(v), 3.5, 0, 2 * Math.PI); ctx.fill(); }
  if (!sweep.points.length && !sweep.running) {
    ctx.fillStyle = cssVar('--muted'); ctx.font = '13px ' + CANVAS_FONT; ctx.textAlign = 'center';
    ctx.fillText(tr('btn.sweep'), (pad.l + w - pad.r) / 2, pad.t + 28);
    ctx.textAlign = 'left';
  }
}

function redrawAll() {
  if (!graph) return;
  drawNetwork(); drawTimeChart(); drawSweepChart();
}
window.addEventListener('resize', redrawAll);

// ---------------------------------------------------------------------------
// Animation loop
// ---------------------------------------------------------------------------
let lastFrame = performance.now();
function frame(now) {
  const dtReal = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (sim && sim.running) {
    const target = sim.t + dtReal * +$('speed').value;
    const tau = currentTau();
    let events = 0;
    while (sim.t < target && events < 50000) {
      if (sim.step(tau) === Infinity) break;
      events++;
    }
    history.push([sim.t, sim.nI / graph.N]);
    if (history.length > 4000) history = history.filter((_, i) => i % 2 === 0);
    if (sim.nI === 0) { setRunning(false); setStatus(tr('status.extinct')); }
    updateReadout();
    drawNetwork(); drawTimeChart();
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Sweep: metastable prevalence vs tau
// ---------------------------------------------------------------------------
function stopSweep() {
  sweep.token++; sweep.running = false;
  $('btn-sweep').disabled = false;
}

function runSweep() {
  stopSweep();
  const token = sweep.token, g = graph;
  const range = sweepRange();
  const n = 24, burn = 15, T = 40;
  sweep.range = range; sweep.points = []; sweep.running = true;
  const warm = new Float64Array(g.N).fill(1);
  sweep.nimfa = [];
  for (let i = 60; i >= 0 && isMarkov(); i--) {
    const t = (i / 60) * range;
    sweep.nimfa.unshift([t, nimfaSteady(g, t, warm, 400)]);
  }
  $('btn-sweep').disabled = true;
  let i = 0;
  const next = () => {
    if (token !== sweep.token) return;
    if (i > n) {
      sweep.running = false; $('btn-sweep').disabled = false;
      setStatus(tr('status.sweepDone', { a: burn, b: T }));
      drawSweepChart(); return;
    }
    const tau = (i / n) * range;
    const s = createSim(g, makeRng(newSeed()), tau);
    s.seed(0.5);
    let area = 0;
    while (s.t < T) {
      const t0 = s.t, prev = s.nI;
      const dt = s.step(tau);
      if (dt === Infinity) break;
      const a = Math.max(t0, burn), b = Math.min(s.t, T);
      if (b > a) area += prev * (b - a);
    }
    sweep.points.push([tau, area / ((T - burn) * g.N)]);
    setStatus(tr('status.sweeping', { i: i + 1, n: n + 1 }));
    drawSweepChart();
    i++;
    setTimeout(next, 0);
  };
  setTimeout(next, 0);
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
$('n').oninput = e => { $('n-val').textContent = e.target.value; };
$('k').oninput = e => { $('k-val').textContent = e.target.value; };
$('n').onchange = regenerate;
$('k').onchange = regenerate;
$('net-type').onchange = regenerate;
$('tau').oninput = e => {
  $('tau-val').textContent = (+e.target.value).toFixed(3).replace(/0$/, '');
  updateNimfaLevel(); drawTimeChart(); drawSweepChart();
};
$('init').oninput = e => { $('init-val').textContent = e.target.value + '%'; };
$('alpha').oninput = () => { $('alpha-val').textContent = currentAlpha().toFixed(2); };
$('alpha').onchange = () => {
  stopSweep();
  sweep.points = []; sweep.nimfa = []; sweep.range = null;
  updateAlpha();
  reinfect();
};
$('speed').oninput = e => { $('speed-val').textContent = e.target.value + '×'; };
$('btn-run').onclick = () => {
  if (sim.nI === 0) reinfect();
  setRunning(!sim.running);
};
$('btn-reset').onclick = reinfect;
$('btn-regen').onclick = regenerate;
$('btn-sweep').onclick = runSweep;
document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

$('net').addEventListener('click', e => {
  const rect = $('net').getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const { X, Y } = netTransform(rect.width, rect.height);
  let best = -1, bestD = Infinity;
  for (let i = 0; i < graph.N; i++) {
    const d = Math.hypot(X(layout.x[i]) - px, Y(layout.y[i]) - py);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0 || bestD > nodeRadius(best) + 4) return;
  sim.tau = currentTau();
  if (sim.infected[best]) sim.recover(best); else sim.infect(best);
  setStatus('');
  history.push([sim.t, sim.nI / graph.N]);
  updateReadout(); drawNetwork(); drawTimeChart();
});

regenerate();
applyLang(currentLang);
requestAnimationFrame(frame);
</script>
</body>
