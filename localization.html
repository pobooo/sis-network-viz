  <header>

      <label><span data-i18n="panel.n">节点数 N</span>: <b id="n-val">500</b></label>

const $ = id => document.getElementById(id);
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const CANVAS_FONT = '"Avenir Next", -apple-system, "PingFang SC", sans-serif';

function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => (Math.random() * 2 ** 31) | 0;

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

// ---------------------------------------------------------------------------
// Network generation
// ---------------------------------------------------------------------------
function buildGraph(N, edgeSet) {
  const adj = Array.from({ length: N }, () => []);
  const edges = [];
  for (const key of edgeSet) {
    const i = Math.floor(key / N), j = key % N;
    adj[i].push(j); adj[j].push(i); edges.push([i, j]);
  }
  return { N, adj, edges };
}
const edgeKey = (i, j, N) => (i < j ? i * N + j : j * N + i);

function genER(N, k, rand) {
  const p = k / (N - 1), set = new Set();
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (rand() < p) set.add(i * N + j);
  return buildGraph(N, set);
}

// preferential = true: Barabási–Albert; false: uniform attachment (exponential degree distribution).
function genGrowth(N, k, rand, preferential) {
  const m = Math.max(1, Math.round(k / 2)), set = new Set(), pool = [];
  for (let i = 0; i <= m; i++) for (let j = i + 1; j <= m; j++) { set.add(edgeKey(i, j, N)); pool.push(i, j); }
  for (let v = m + 1; v < N; v++) {
    const targets = new Set();
    while (targets.size < m) targets.add(preferential ? pool[Math.floor(rand() * pool.length)] : Math.floor(rand() * v));
    for (const u of targets) { set.add(edgeKey(u, v, N)); pool.push(u, v); }
  }
  return buildGraph(N, set);
}

function genWS(N, k, rand, rewire = 0.1) {
  const half = Math.max(1, Math.round(k / 2)), set = new Set();
  for (let i = 0; i < N; i++) for (let d = 1; d <= half; d++) set.add(edgeKey(i, (i + d) % N, N));
  for (const key of Array.from(set)) {
    if (rand() >= rewire) continue;
    const i = Math.floor(key / N);
    for (let tries = 0; tries < 20; tries++) {
      const j = Math.floor(rand() * N);
      const nk = edgeKey(i, j, N);
      if (j !== i && !set.has(nk)) { set.delete(key); set.add(nk); break; }
    }
  }
  return buildGraph(N, set);
}

function genStar(N) {
  const set = new Set();
  for (let i = 1; i < N; i++) set.add(edgeKey(0, i, N));
  return buildGraph(N, set);
}

function generate(type, N, k, rand) {
  if (type === 'ba') return genGrowth(N, k, rand, true);
  if (type === 'ua') return genGrowth(N, k, rand, false);
  if (type === 'star') return genStar(N);
  if (type === 'ws') return genWS(N, k, rand);
  return genER(N, k, rand);
}

// Fruchterman–Reingold layout in the unit square.
function layoutGraph(g, rand) {
  const { N, edges } = g;
  const x = new Float64Array(N), y = new Float64Array(N);
  for (let i = 0; i < N; i++) { x[i] = rand(); y[i] = rand(); }
  const kf = Math.sqrt(1 / N);
  const dx = new Float64Array(N), dy = new Float64Array(N);
  const exact = N <= 400, iters = exact ? 250 : 180;
  const repel = (i, j) => {
    const ex = x[i] - x[j], ey = y[i] - y[j];
    const d2 = ex * ex + ey * ey + 1e-9, f = (kf * kf) / d2;
    dx[i] += ex * f; dy[i] += ey * f; dx[j] -= ex * f; dy[j] -= ey * f;
  };
  // Large graphs: grid variant of Fruchterman–Reingold, repulsion only within 2k.
  const cs = 2 * kf, next = new Int32Array(N);
  let temp = 0.1;
  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);
    if (exact) {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) repel(i, j);
    } else {
      let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
      for (let i = 0; i < N; i++) { mx = Math.min(mx, x[i]); my = Math.min(my, y[i]); Mx = Math.max(Mx, x[i]); My = Math.max(My, y[i]); }
      const W = Math.floor((Mx - mx) / cs) + 1, H = Math.floor((My - my) / cs) + 1;
      const head = new Int32Array(W * H).fill(-1), cell = new Int32Array(N);
      for (let i = 0; i < N; i++) {
        const c = Math.floor((y[i] - my) / cs) * W + Math.floor((x[i] - mx) / cs);
        cell[i] = c; next[i] = head[c]; head[c] = i;
      }
      const cs2 = cs * cs;
      for (let i = 0; i < N; i++) {
        const cx = cell[i] % W, cy = (cell[i] - cx) / W;
        for (let oy = -1; oy <= 1; oy++) {
          const yy = cy + oy; if (yy < 0 || yy >= H) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const xx = cx + ox; if (xx < 0 || xx >= W) continue;
            for (let j = head[yy * W + xx]; j !== -1; j = next[j]) {
              if (j <= i) continue;
              const ex = x[i] - x[j], ey = y[i] - y[j];
              if (ex * ex + ey * ey < cs2) repel(i, j);
            }
          }
        }
      }
    }
    for (const [i, j] of edges) {
      const ex = x[i] - x[j], ey = y[i] - y[j];
      const d = Math.sqrt(ex * ex + ey * ey) + 1e-9, f = d / kf;
      dx[i] -= ex * f; dy[i] -= ey * f; dx[j] += ex * f; dy[j] += ey * f;
    }
    for (let i = 0; i < N; i++) {
      dx[i] += (0.5 - x[i]) * 0.05 * N * kf; dy[i] += (0.5 - y[i]) * 0.05 * N * kf;
      const d = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) + 1e-9, s = Math.min(d, temp) / d;
      x[i] += dx[i] * s; y[i] += dy[i] * s;
    }
    temp = Math.max(0.002, temp * 0.97);
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < N; i++) { x0 = Math.min(x0, x[i]); x1 = Math.max(x1, x[i]); y0 = Math.min(y0, y[i]); y1 = Math.max(y1, y[i]); }
  for (let i = 0; i < N; i++) { x[i] = (x[i] - x0) / (x1 - x0 || 1); y[i] = (y[i] - y0) / (y1 - y0 || 1); }
  return { x, y };
}

// ---------------------------------------------------------------------------
// Spectral quantities and mean-field steady states
// ---------------------------------------------------------------------------
// Power iteration on A + I avoids oscillation on bipartite graphs such as the star.
function principalEigen(g, maxIter = 5000) {
  const { N, adj } = g;
  let v = new Float64Array(N).fill(1 / Math.sqrt(N)), w = new Float64Array(N), lambda = 0;
  for (let it = 0; it < maxIter; it++) {
    for (let i = 0; i < N; i++) { let s = v[i]; for (const j of adj[i]) s += v[j]; w[i] = s; }
    let dot = 0, norm = 0;
    for (let i = 0; i < N; i++) { dot += v[i] * w[i]; norm += w[i] * w[i]; }
    norm = Math.sqrt(norm);
    for (let i = 0; i < N; i++) w[i] /= norm;
    [v, w] = [w, v];
    const next = dot - 1;
    if (Math.abs(next - lambda) < 1e-10 * Math.max(1, next)) { lambda = next; break; }
    lambda = next;
  }
  return { lambda, x: v };
}

function coefficients(g) {
  const { lambda, x } = principalEigen(g);
  let s1 = 0, s3 = 0, s4 = 0;
  for (let i = 0; i < g.N; i++) { s1 += x[i]; s3 += x[i] ** 3; s4 += x[i] ** 4; }
  const a = s1 / (g.N * s3);
  const amax = 2 * (1 + lambda) * Math.log(1 + lambda) / lambda * a;
  return { lambda, x, ipr: s4, a, amax, amin: amax / (1 + lambda) };
}

// NIMFA steady state with δ = 1: v_i = τ s_i / (1 + τ s_i), s_i = Σ_j a_ij v_j.
function nimfaSteady(g, tau, maxIter = 3000) {
  const { N, adj } = g;
  let v = new Float64Array(N).fill(0.5), w = new Float64Array(N);
  for (let it = 0; it < maxIter; it++) {
    let diff = 0;
    for (let i = 0; i < N; i++) {
      let s = 0; for (const j of adj[i]) s += v[j];
      w[i] = tau * s / (1 + tau * s); diff = Math.max(diff, Math.abs(w[i] - v[i]));
    }
    [v, w] = [w, v];
    if (diff < 1e-11) break;
  }
  return v;
}

// Bursty mean-field map with β = 1, δ = 1/τ; returns v just after a burst.
function burstySteady(g, tau, maxIter = 3000) {
  const { N, adj } = g, decay = Math.exp(-1 / tau);
  let v = new Float64Array(N).fill(0.5), w = new Float64Array(N);
  const u = new Float64Array(N);
  for (let it = 0; it < maxIter; it++) {
    for (let i = 0; i < N; i++) u[i] = v[i] * decay;
    let diff = 0;
    for (let i = 0; i < N; i++) {
      let prod = 1; for (const j of adj[i]) prod *= 1 - u[j];
      w[i] = u[i] + (1 - u[i]) * (1 - prod); diff = Math.max(diff, Math.abs(w[i] - v[i]));
    }
    [v, w] = [w, v];
    if (diff < 1e-11) break;
  }
  return v;
}

// ---------------------------------------------------------------------------
// Quasi-stationary memory: on extinction, continue from a stored active state.
// ---------------------------------------------------------------------------
function makeMemory(rand) {
  const slots = [];
  return {
    store(nodes) {
      if (slots.length < QS_SLOTS) slots.push(nodes);
      else slots[Math.floor(rand() * QS_SLOTS)] = nodes;
    },
    draw(N) {
      return slots.length ? slots[Math.floor(rand() * slots.length)] : Array.from({ length: N }, (_, i) => i);
    },
  };
}

// ---------------------------------------------------------------------------
// Markovian SIS (Gillespie, δ = 1) with per-node infected-time accounting.
// ---------------------------------------------------------------------------
function makeMarkov(g, rand) {
  const { N, adj } = g;
  const infected = new Uint8Array(N), infNbrs = new Int32Array(N);
  const list = new Int32Array(N), pos = new Int32Array(N).fill(-1);
  const since = new Float64Array(N), acc = new Float64Array(N);
  const memory = makeMemory(rand);
  const S = { infected, nI: 0, siEdges: 0, t: 0, statStart: 0, restores: 0, nextStore: 1, hist: [], ext: [] };

  // Fenwick tree over susceptible nodes, weighted by their number of infected neighbors,
  // so the node to infect is drawn in O(log N).
  const tree = new Int32Array(N + 1);
  let top = 1; while (top * 2 <= N) top *= 2;
  const fenAdd = (i, d) => { for (i++; i <= N; i += i & -i) tree[i] += d; };
  const fenFind = r => {
    let idx = 0;
    for (let b = top; b > 0; b >>= 1) {
      const nx = idx + b;
      if (nx <= N && tree[nx] <= r) { idx = nx; r -= tree[nx]; }
    }
    return idx;
  };

  const infect = v => {
    if (infected[v]) return;
    infected[v] = 1; pos[v] = S.nI; list[S.nI++] = v; since[v] = S.t;
    S.siEdges -= infNbrs[v];
    if (infNbrs[v]) fenAdd(v, -infNbrs[v]);
    for (const u of adj[v]) { infNbrs[u]++; if (!infected[u]) { S.siEdges++; fenAdd(u, 1); } }
  };
  const recover = v => {
    if (!infected[v]) return;
    infected[v] = 0;
    acc[v] += S.t - Math.max(since[v], S.statStart);
    const p = pos[v], last = list[--S.nI];
    list[p] = last; pos[last] = p; pos[v] = -1;
    S.siEdges += infNbrs[v];
    if (infNbrs[v]) fenAdd(v, infNbrs[v]);
    for (const u of adj[v]) { infNbrs[u]--; if (!infected[u]) { S.siEdges--; fenAdd(u, -1); } }
  };
  for (let v = 0; v < N; v++) infect(v);

  S.advance = (target, tau, qs) => {
    if (S.nI === 0) {
      if (!qs) { S.t = target; S.hist.push([S.t, 0]); return; }
      for (const v of memory.draw(N)) infect(v);
    }
    let events = 0;
    while (events < 400000) {
      const total = S.nI + tau * S.siEdges;
      const dt = -Math.log(1 - rand()) / total;
      if (S.t + dt > target) { S.t = target; break; }
      S.t += dt; events++;
      while (S.t >= S.nextStore) { memory.store(Array.from(list.subarray(0, S.nI))); S.nextStore += 1; }
      if (rand() * total < S.nI) {
        recover(list[Math.floor(rand() * S.nI)]);
        if (S.nI === 0) {
          S.restores++; S.ext.push(S.t);
          if (!qs) { S.hist.push([S.t, 0]); S.t = target; break; }
          for (const v of memory.draw(N)) infect(v);
        }
      } else infect(fenFind(Math.floor(rand() * S.siEdges)));
    }
    S.hist.push([S.t, S.nI / N]);
  };
  S.resetStats = () => { S.statStart = S.t; acc.fill(0); S.restores = 0; };
  S.window = () => S.t - S.statStart;
  S.rho = () => {
    const T = S.window(), r = new Float64Array(N);
    if (T <= 0) return r;
    for (let v = 0; v < N; v++) r[v] = (acc[v] + (infected[v] ? S.t - Math.max(since[v], S.statStart) : 0)) / T;
    return r;
  };
  S.isInfected = v => infected[v] === 1;
  S.count = () => S.nI;
  return S;
}

// ---------------------------------------------------------------------------
// Bursty SIS with β = 1: bursts at t = 1, 2, ...; curing at rate δ = 1/τ in between.
// Every infected node draws an exponential curing time right after a burst
// (curing is memoryless, so redrawing for nodes that were already infected is exact).
// ---------------------------------------------------------------------------
function makeBursty(g, rand) {
  const { N, adj } = g;
  const inPlus = new Uint8Array(N), cure = new Float64Array(N), acc = new Float64Array(N);
  const plus = new Int32Array(N), mark = new Uint8Array(N);
  const memory = makeMemory(rand);
  const B = { n: 0, t: 0, nPlus: 0, statStart: 0, periods: 0, restores: 0, hist: [], ext: [], absorbed: false };

  const startPeriod = (nodes, delta) => {
    inPlus.fill(0); B.nPlus = 0;
    for (const v of nodes) { inPlus[v] = 1; plus[B.nPlus++] = v; cure[v] = B.n - Math.log(1 - rand()) / delta; }
  };
  B.count = () => { let c = 0; for (let q = 0; q < B.nPlus; q++) if (cure[plus[q]] > B.t) c++; return c; };
  B.isInfected = v => inPlus[v] === 1 && cure[v] > B.t;

  B.init = delta => { startPeriod(Array.from({ length: N }, (_, i) => i), delta); B.hist.push([0, 1]); };
  B.advance = (target, delta, qs) => {
    while (B.n + 1 <= target) {
      const end = B.n + 1, survivors = [];
      for (let q = 0; q < B.nPlus; q++) {
        const v = plus[q];
        if (B.n >= B.statStart) acc[v] += Math.min(cure[v], end) - B.n;
        if (cure[v] >= end) survivors.push(v);
      }
      if (B.n >= B.statStart) B.periods++;
      B.n = end; B.t = end;
      B.hist.push([end, survivors.length / N]);
      let seeds = survivors;
      if (!survivors.length) {
        if (!B.absorbed) { B.restores++; B.ext.push(end); }
        B.absorbed = !qs;
        seeds = qs ? memory.draw(N) : [];
      } else memory.store(survivors);
      mark.fill(0);
      const next = [];
      for (const v of seeds) {
        if (!mark[v]) { mark[v] = 1; next.push(v); }
        for (const u of adj[v]) if (!mark[u]) { mark[u] = 1; next.push(u); }
      }
      startPeriod(next, delta);
      B.hist.push([end, next.length / N]);
    }
    B.t = target;
    B.hist.push([B.t, B.count() / N]);
  };
  B.resetStats = () => { B.statStart = B.n + 1; B.periods = 0; acc.fill(0); B.restores = 0; };
  B.window = () => B.periods;
  B.rho = () => {
    const r = new Float64Array(N);
    if (B.periods > 0) for (let v = 0; v < N; v++) r[v] = acc[v] / B.periods;
    return r;
  };
  return B;
}

// ---------------------------------------------------------------------------
// App state
// ---------------------------------------------------------------------------
let graph = null, layout = null, stats = null, simM = null, simB = null;
let running = false, clock = 0, statsStarted = false, mf = null, topSet = null;
let scale = { token: 0, points: [], done: false };

const currentTT = () => +$('tt').value;
const tauMarkov = () => (1 + currentTT()) / stats.lambda;
const tauBursty = () => (1 + currentTT()) / Math.log(1 + stats.lambda);

function regenerate() {
  const rand = makeRng(newSeed());
  const N = +$('n').value, k = +$('k').value, type = $('net-type').value;
  graph = generate(type, N, k, rand);
  layout = layoutGraph(graph, rand);
  const deg = graph.adj.map(a => a.length);
  const meanDeg = deg.reduce((a, b) => a + b, 0) / N;
  stats = { deg, meanDeg, ...coefficients(graph) };
  const order = Array.from({ length: N }, (_, i) => i).sort((i, j) => stats.x[j] - stats.x[i]);
  topSet = order.slice(0, Math.max(1, Math.round(TOP_FRACTION * N)));
  $('s-edges').textContent = graph.edges.length;
  $('s-lambda').textContent = stats.lambda.toFixed(3);
  $('s-ipr').textContent = stats.ipr.toFixed(4);
  $('s-taucm').textContent = (1 / stats.lambda).toFixed(4);
  $('s-taucb').textContent = (1 / Math.log(1 + stats.lambda)).toFixed(4);
  updateMeanField();
  restart();
  computeScaling();
}

function restart() {
  const seed = newSeed();
  simM = makeMarkov(graph, makeRng(seed));
  simB = makeBursty(graph, makeRng(seed + 1));
  simB.init(1 / tauBursty());
  simM.hist.push([0, 1]);
  clock = 0; statsStarted = false;
  setStatus('');
  updateReadout();
  redrawAll();
}

function setStatus(msg) { $('status').textContent = msg; }
const qsOn = () => $('qs').checked;
const bothExtinct = () => simM.count() === 0 && simB.absorbed;

function clearStats() {
  simM.resetStats(); simB.resetStats();
  statsStarted = clock >= BURN_IN;
  updateReadout(); redrawAll();
}

function updateMeanField() {
  const vN = nimfaSteady(graph, tauMarkov());
  const tauB = tauBursty(), vB = burstySteady(graph, tauB);
  const delta = 1 / tauB, decay = Math.exp(-delta);
  // Time-averaged bursty profile: v_i^+ e^{-δt} averaged over one period.
  const rhoB = vB.map(v => v * (1 - decay) / delta);
  const mean = v => v.reduce((a, b) => a + b, 0) / v.length;
  mf = { yM: mean(vN), yPlus: mean(vB), yMinus: mean(vB) * decay, shareM: topShare(vN), shareB: topShare(rhoB) };
}

function topShare(r) {
  let tot = 0, top = 0;
  for (let i = 0; i < r.length; i++) tot += r[i];
  for (const i of topSet) top += r[i];
  return tot > 0 ? top / tot : NaN;
}

function correlation(a, b) {
  const n = a.length;
  let ma = 0, mb = 0;
  for (let i = 0; i < n; i++) { ma += a[i]; mb += b[i]; }
  ma /= n; mb /= n;
  let c = 0, sa = 0, sb = 0;
  for (let i = 0; i < n; i++) { c += (a[i] - ma) * (b[i] - mb); sa += (a[i] - ma) ** 2; sb += (b[i] - mb) ** 2; }
  return sa > 0 && sb > 0 ? c / Math.sqrt(sa * sb) : NaN;
}

const pct = v => (isFinite(v) ? (100 * v).toFixed(1) + '%' : '–');

function updateReadout() {
  if (!simM) return;
  $('s-t').textContent = clock.toFixed(1);
  $('s-window').textContent = statsStarted ? simM.window().toFixed(0) + ' / ' + simB.window() : '–';
  $('s-restores').textContent = simM.restores + ' / ' + simB.restores;
  const burn = statsStarted ? '' : ' ' + tr('foot.burn', { T: BURN_IN });
  $('foot-m').textContent = tr('foot.prev', { p: pct(simM.count() / graph.N) }) + burn;
  $('foot-b').textContent = tr('foot.prev', { p: pct(simB.count() / graph.N) }) + burn;
  $('sh-x').textContent = pct(topShare(stats.x));
  $('sh-mf-m').textContent = pct(mf.shareM);
  $('sh-mf-b').textContent = pct(mf.shareB);
  if (statsStarted && simM.window() > 0 && simB.window() > 0) {
    const rM = simM.rho(), rB = simB.rho();
    $('sh-m').textContent = pct(topShare(rM));
    $('sh-b').textContent = pct(topShare(rB));
    $('cor-m').textContent = correlation(rM, stats.x).toFixed(3);
    $('cor-b').textContent = correlation(rB, stats.x).toFixed(3);
  } else {
    ['sh-m', 'sh-b', 'cor-m', 'cor-b'].forEach(id => { $(id).textContent = '–'; });
  }
}

function setRunning(on) {
  running = on;
  $('btn-run').textContent = tr(on ? 'btn.pause' : 'btn.start');
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function nodeRadius(i) {
  const base = Math.max(1.3, Math.min(6, 45 / Math.sqrt(graph.N)));
  return base * (0.7 + 0.3 * Math.min(4, Math.sqrt(stats.deg[i] / Math.max(stats.meanDeg, 1))));
}

function mix(c1, c2, t) {
  const p = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
  const a = p(c1), b = p(c2);
  return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',') + ')';
}

function drawNetwork(canvasId, sim) {
  const { ctx, w, h } = setupCanvas($(canvasId));
  ctx.clearRect(0, 0, w, h);
  if (!graph) return;
  const pad = 10, s = Math.min(w, h) - 2 * pad, ox = (w - s) / 2, oy = (h - s) / 2;
  const X = x => ox + x * s, Y = y => oy + y * s;
  ctx.strokeStyle = cssVar('--edge'); ctx.lineWidth = 1;
  ctx.beginPath();
  for (const [i, j] of graph.edges) { ctx.moveTo(X(layout.x[i]), Y(layout.y[i])); ctx.lineTo(X(layout.x[j]), Y(layout.y[j])); }
  ctx.stroke();
  const cI = cssVar('--infected'), cS = cssVar('--susceptible');
  const byRho = $('color-mode').value === 'rho';
  let rho = null, rmax = 0;
  if (byRho) { rho = sim.rho(); for (const r of rho) rmax = Math.max(rmax, r); }
  // Draw low values first so that hot nodes stay on top.
  const order = byRho && rmax > 0 ? Array.from(rho.keys()).sort((a, b) => rho[a] - rho[b]) : null;
  for (let q = 0; q < graph.N; q++) {
    const i = order ? order[q] : q;
    let fill, stroke;
    if (byRho) { const t = rmax > 0 ? rho[i] / rmax : 0; fill = mix(cS, cI, t); stroke = t > 0.5 ? fill : '#bdb5a6'; }
    else { const on = sim.isInfected(i); fill = on ? cI : cS; stroke = on ? cI : '#bdb5a6'; }
    ctx.beginPath();
    ctx.arc(X(layout.x[i]), Y(layout.y[i]), nodeRadius(i), 0, 2 * Math.PI);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke();
  }
}

function gridY(ctx, w, h, pad, ymax, digits) {
  ctx.strokeStyle = cssVar('--grid'); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 4; i++) { const y = pad.t + i * (h - pad.t - pad.b) / 4; ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); }
  ctx.stroke();
  ctx.fillStyle = cssVar('--muted'); ctx.font = '12px ' + CANVAS_FONT;
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + i * (h - pad.t - pad.b) / 4;
    ctx.fillText((ymax * (1 - i / 4)).toFixed(digits), pad.l - 6, y + 4);
  }
  ctx.textAlign = 'left';
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 4 ? 4 : m <= 8 ? 8 : 10) * e;
}

function drawTimeChart() {
  const { ctx, w, h } = setupCanvas($('c-time'));
  ctx.clearRect(0, 0, w, h);
  if (!simM) return;
  const pad = { l: 46, r: 12, t: 10, b: 26 };
  const t1 = Math.max(TIME_WINDOW, clock), t0 = t1 - TIME_WINDOW;
  let vmax = Math.max(mf.yM, mf.yPlus);
  for (const hist of [simM.hist, simB.hist]) for (const [t, v] of hist) if (t >= t0 && t > 2) vmax = Math.max(vmax, v);
  const ymax = Math.min(1, niceMax(vmax * 1.05));
  gridY(ctx, w, h, pad, ymax, ymax < 0.1 ? 3 : 2);
  const X = t => pad.l + ((t - t0) / TIME_WINDOW) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - Math.min(v / ymax, 1.02) * (h - pad.t - pad.b);
  ctx.fillStyle = cssVar('--muted'); ctx.font = '12px ' + CANVAS_FONT;
  ctx.textAlign = 'left'; ctx.fillText(t0.toFixed(0), pad.l, h - 8);
  ctx.textAlign = 'center'; ctx.fillText(tr('axis.t'), (pad.l + w - pad.r) / 2, h - 8);
  ctx.textAlign = 'right'; ctx.fillText(t1.toFixed(0), w - pad.r, h - 8);
  ctx.textAlign = 'left';
  if (clock < BURN_IN && t0 === 0) {
    ctx.fillStyle = cssVar('--grid');
    ctx.fillRect(X(0), pad.t, X(BURN_IN) - X(0), h - pad.t - pad.b);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(pad.l, pad.t - 2, w - pad.l - pad.r, h - pad.t - pad.b + 4); ctx.clip();
  const hline = (v, color) => {
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke(); ctx.restore();
  };
  hline(mf.yM, cssVar('--markov'));
  hline(mf.yPlus, cssVar('--burst'));
  hline(mf.yMinus, cssVar('--burst'));
  const curve = (hist, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let started = false;
    for (const [t, v] of hist) {
      if (t < t0 - 1) continue;
      if (!started) { ctx.moveTo(X(t), Y(v)); started = true; } else ctx.lineTo(X(t), Y(v));
    }
    ctx.stroke();
  };
  curve(simB.hist, cssVar('--burst'));
  curve(simM.hist, cssVar('--markov'));
  ctx.restore();
  const marks = (times, color, row) => {
    ctx.fillStyle = color;
    const y = h - pad.b - 2 - row * 9;
    for (const t of times) {
      if (t < t0 || t > t1) continue;
      const x = X(t);
      ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.closePath(); ctx.fill();
    }
  };
  marks(simM.ext, cssVar('--markov'), 1);
  marks(simB.ext, cssVar('--burst'), 0);
}

function drawScatter() {
  const { ctx, w, h } = setupCanvas($('c-scatter'));
  ctx.clearRect(0, 0, w, h);
  if (!simM) return;
  const pad = { l: 46, r: 12, t: 10, b: 26 };
  const ready = statsStarted && simM.window() > 0 && simB.window() > 0;
  const rM = ready ? simM.rho() : null, rB = ready ? simB.rho() : null;
  let vmax = 0;
  if (ready) for (let i = 0; i < graph.N; i++) vmax = Math.max(vmax, rM[i], rB[i]);
  const ymax = Math.min(1, niceMax(vmax || 1));
  gridY(ctx, w, h, pad, ymax, 2);
  let xmax = 0; for (const v of stats.x) xmax = Math.max(xmax, v);
  const X = x => pad.l + (x / xmax) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / ymax) * (h - pad.t - pad.b);
  ctx.fillStyle = cssVar('--muted'); ctx.font = '12px ' + CANVAS_FONT;
  ctx.textAlign = 'left'; ctx.fillText('0', pad.l, h - 8);
  ctx.textAlign = 'center'; ctx.fillText(tr('axis.x'), (pad.l + w - pad.r) / 2, h - 8);
  ctx.textAlign = 'right'; ctx.fillText('1', w - pad.r, h - 8);
  ctx.textAlign = 'left';
  if (!ready) return;
  const dots = (r, color) => {
    ctx.fillStyle = color; ctx.globalAlpha = 0.55;
    for (let i = 0; i < graph.N; i++) { ctx.beginPath(); ctx.arc(X(stats.x[i]), Y(r[i]), 2.4, 0, 2 * Math.PI); ctx.fill(); }
    ctx.globalAlpha = 1;
  };
  dots(rM, cssVar('--markov'));
  dots(rB, cssVar('--burst'));
}

function drawScaleChart() {
  const { ctx, w, h } = setupCanvas($('c-scale'));
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 46, r: 12, t: 10, b: 26 };
  const pts = scale.points;
  let vmax = 0; for (const p of pts) vmax = Math.max(vmax, p.amax);
  const ymax = niceMax(vmax * 1.05 || 1);
  gridY(ctx, w, h, pad, ymax, 2);
  const lx0 = Math.log(SCALE_NS[0]), lx1 = Math.log(SCALE_NS[SCALE_NS.length - 1]);
  const X = n => pad.l + ((Math.log(n) - lx0) / (lx1 - lx0)) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - (v / ymax) * (h - pad.t - pad.b);
  ctx.fillStyle = cssVar('--muted'); ctx.font = '12px ' + CANVAS_FONT; ctx.textAlign = 'center';
  for (const n of SCALE_NS) ctx.fillText(String(n), X(n), h - 8);
  ctx.textAlign = 'left';
  const series = (key, color, dashed) => {
    ctx.save(); if (dashed) ctx.setLineDash([5, 4]);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => { if (i === 0) ctx.moveTo(X(p.n), Y(p[key])); else ctx.lineTo(X(p.n), Y(p[key])); });
    ctx.stroke(); ctx.restore();
    ctx.fillStyle = color;
    for (const p of pts) { ctx.beginPath(); ctx.arc(X(p.n), Y(p[key]), 3, 0, 2 * Math.PI); ctx.fill(); }
  };
  series('a', cssVar('--markov'), false);
  series('amax', cssVar('--burst'), false);
  series('amin', cssVar('--burst'), true);
  // Current network.
  if (graph) {
    ctx.save(); ctx.setLineDash([2, 3]); ctx.strokeStyle = cssVar('--gold'); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(X(graph.N), pad.t); ctx.lineTo(X(graph.N), h - pad.b); ctx.stroke(); ctx.restore();
  }
}

function redrawAll() {
  if (!graph || !simM) return;
  drawNetwork('net-m', simM); drawNetwork('net-b', simB);
  drawTimeChart(); drawScatter(); drawScaleChart();
}
window.addEventListener('resize', redrawAll);

// ---------------------------------------------------------------------------
// Coefficients vs N (mean field), computed in the background.
// ---------------------------------------------------------------------------
function computeScaling() {
  const token = ++scale.token, type = $('net-type').value, k = +$('k').value;
  scale.points = []; scale.done = false;
  $('scale-status').textContent = tr('scale.running');
  let idx = 0;
  const next = () => {
    if (token !== scale.token) return;
    if (idx >= SCALE_NS.length) { scale.done = true; $('scale-status').textContent = ''; drawScaleChart(); return; }
    const n = SCALE_NS[idx];
    let a = 0, amax = 0, amin = 0;
    for (let r = 0; r < SCALE_REPS; r++) {
      const c = coefficients(generate(type, n, k, makeRng(newSeed())));
      a += c.a; amax += c.amax; amin += c.amin;
    }
    scale.points.push({ n, a: a / SCALE_REPS, amax: amax / SCALE_REPS, amin: amin / SCALE_REPS });
    drawScaleChart();
    idx++;
    setTimeout(next, 0);
  };
  setTimeout(next, 0);
}

// ---------------------------------------------------------------------------
// Animation loop
// ---------------------------------------------------------------------------
function trimHist(hist, key = e => e[0]) {
  const cut = clock - TIME_WINDOW - 2;
  let i = 0; while (i < hist.length && key(hist[i]) < cut) i++;
  if (i > 0) hist.splice(0, i);
}

let lastFrame = performance.now(), frameCount = 0;
function frame(now) {
  const dtReal = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (running) {
    clock += dtReal * +$('speed').value;
    const qs = qsOn();
    simM.advance(clock, tauMarkov(), qs);
    simB.advance(clock, 1 / tauBursty(), qs);
    if (!statsStarted && clock >= BURN_IN) { simM.resetStats(); simB.resetStats(); statsStarted = true; }
    trimHist(simM.hist); trimHist(simB.hist);
    trimHist(simM.ext, t => t); trimHist(simB.ext, t => t);
    if (!qs && bothExtinct()) { setRunning(false); setStatus(tr('status.extinct')); updateReadout(); }
    drawNetwork('net-m', simM); drawNetwork('net-b', simB);
    drawTimeChart();
    if (frameCount++ % 6 === 0) { updateReadout(); drawScatter(); }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
function syncKEnabled() {
  const star = $('net-type').value === 'star';
  $('k').disabled = star;
  $('k-label').classList.toggle('disabled', star);
}

$('n').oninput = e => { $('n-val').textContent = e.target.value; };
$('k').oninput = e => { $('k-val').textContent = e.target.value; };
$('n').onchange = regenerate;
$('k').onchange = regenerate;
$('net-type').onchange = () => { syncKEnabled(); regenerate(); };
$('tt').oninput = e => { $('tt-val').textContent = (+e.target.value).toFixed(2); };
$('tt').onchange = () => { updateMeanField(); clearStats(); };
$('speed').oninput = e => { $('speed-val').textContent = e.target.value + '×'; };
$('color-mode').onchange = () => { drawNetwork('net-m', simM); drawNetwork('net-b', simB); };
$('btn-run').onclick = () => {
  if (!running && !qsOn() && bothExtinct()) restart();
  setRunning(!running);
};
$('btn-restart').onclick = restart;
$('qs').onchange = () => setStatus('');
$('btn-clear').onclick = clearStats;
$('btn-regen').onclick = regenerate;
document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

syncKEnabled();
regenerate();
applyLang(currentLang);
requestAnimationFrame(frame);
</script>
</body>
</html>
